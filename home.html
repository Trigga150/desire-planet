<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      color: #fff;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .logo {
      width: 100px;
    }
    nav a {
      margin: 0 10px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }

    /* Featured section */
    .featured {
      margin: 40px 0;
    }
    .featured h2 {
      margin-bottom: 20px;
      text-shadow: 0 0 5px #000;
    }
    .featured-items {
      display: flex;
      gap: 20px;
    }
    .item {
      flex: 1;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
    }

    /* Categories */
    .categories {
      margin: 40px 0;
    }
    .categories h2 {
      margin-bottom: 20px;
      text-shadow: 0 0 5px #000;
    }
    .category-list {
      display: flex;
      gap: 20px;
    }
    .category {
      flex: 1;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      text-align: center;
      border-radius: 8px;
    }

    /* Subscription CTA */
    .cta {
      margin: 50px 0;
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 8px;
    }
    .cta h2 {
      margin-bottom: 15px;
    }
    .cta button {
      padding: 12px 25px;
      font-size: 1em;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .cta button:hover {
      background-color: #666;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9em;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <img src="logo.png" alt="Logo" class="logo" />
      <nav>
        <a href="#">Home</a>
        <a href="#">Categories</a>
        <a href="#">Membership</a>
        <a href="#">Support</a>
      </nav>
    </header>

    <!-- Featured Section -->
    <section class="featured">
      <h2>Featured</h2>
      <div class="featured-items">
        <div class="item">Placeholder 1</div>
        <div class="item">Placeholder 2</div>
        <div class="item">Placeholder 3</div>
      </div>
    </section>

    <!-- Categories Section -->
    <section class="categories">
      <h2>Categories</h2>
      <div class="category-list">
        <div class="category">Category A</div>
        <div class="category">Category B</div>
        <div class="category">Category C</div>
      </div>
    </section>

    <!-- Subscription CTA -->
    <section class="cta">
      <h2>Join Now</h2>
      <p>Access exclusive content and benefits.</p>
      <button>Subscribe</button>
    </section>

    <!-- Footer -->
    <footer>
      <p>About | Contact | Support</p>
      <p>Legal disclaimers and compliance notice</p>
    </footer>
  </div>
</body>
</html>
